name: validate

# This repo eats its own dog food: it owns the reusable workflow (dotfiles
# #1410 D-10) and validates itself through the same call the other fourteen
# *-skills repos make. A local `./` reference means a change to skill-check.yml
# is proven here, on its own PR, before any sibling repo picks it up.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/skill-check.yml
    with:
      plugin-name: harness
      # Six sites in THIS repo. Deliberately not a default on the input:
      # `license:` in SKILL.md frontmatter exists in 1 of the 15 siblings
      # today, so a default would turn them red at @main - the one thing
      # CLAUDE.md forbids. Defaulting the five machine-readable sites, or
      # backfilling the frontmatter first, is a follow-up.
      # LICENSE's own regex names MIT on purpose: a relicense then fails on
      # this file by name, which is the file whose prose has to be rewritten
      # by hand anyway - the other five carry an SPDX id and compare as one.
      consistency-checks: |
        license:
          LICENSE: '^(MIT) License'
          '.*-plugin/plugin.json': '"license":\s*"([^"]+)"'
          package.json: '"license":\s*"([^"]+)"'
          'skills/*/SKILL.md': '^license:\s*(\S+)'

  # Repo-local, deliberately NOT in skill-check.yml: that workflow is an API the
  # other fourteen repos call, and none of them ships this file. The convention's
  # own gate grep moves there once the rollout lands (references/plugin-root.md).
  plugin-root-selfcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Plugin-root snippets behave as documented
        run: sh references/plugin-root.selfcheck.sh
