name: skill-check

# Reusable validation workflow for every dEitY719/*-skills marketplace repo.
#
# Owner: dEitY719/harness-skills (dotfiles #1410 D-10).
# Callers pass their plugin name; everything else is derived. Do NOT copy this
# file into a sibling repo — call it:
#
#   jobs:
#     validate:
#       uses: dEitY719/harness-skills/.github/workflows/skill-check.yml@main
#       with:
#         plugin-name: packaging
#
# Adding a check here applies it to all fifteen repos at once. That is the
# entire point (NF-2, anti-drift).

on:
  workflow_call:
    inputs:
      plugin-name:
        description: "Plugin name — must match `name` in every manifest and the .opencode/plugins/<name>.js filename."
        required: true
        type: string
      max-skill-lines:
        description: "Maximum lines allowed in a SKILL.md before progressive disclosure is required (skill:check)."
        required: false
        type: number
        default: 100
      description-budget:
        description: "Maximum total characters across all skill descriptions (Codex context budget, #1410 NF-1)."
        required: false
        type: number
        default: 5440
      shellcheck-exclude-paths:
        description: "Newline- or comma-separated path prefixes this repo does not own -- trees it vendors and is told not to edit. Excluded from both the shellcheck and the emoji step. Empty scans everything. Name kept for compatibility: callers pin @main, so a rename could not retire it."
        required: false
        type: string
        default: "lib/vendor/"
      allow-emoji-paths:
        description: "Newline- or comma-separated path prefixes exempt from the emoji ban, for skills whose subject matter is emoji. Empty (the default) bans emoji repo-wide."
        required: false
        type: string
        default: ""
      consistency-checks:
        description: "YAML mapping of <set name> -> {<path glob>: <regex>}, asserting every matched file carries the same capture-group-1 value. Empty (the default) declares no set and passes."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PLUGIN_NAME: ${{ inputs.plugin-name }}
      MAX_SKILL_LINES: ${{ inputs.max-skill-lines }}
      DESCRIPTION_BUDGET: ${{ inputs.description-budget }}
      SHELLCHECK_EXCLUDE_PATHS: ${{ inputs.shellcheck-exclude-paths }}
      ALLOW_EMOJI_PATHS: ${{ inputs.allow-emoji-paths }}
      CONSISTENCY_CHECKS: ${{ inputs.consistency-checks }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON manifests parse
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            if jq empty "$f" 2>/dev/null; then
              echo "ok    $f"
            else
              echo "FAIL  $f (invalid JSON)"
              fail=1
            fi
          done < <(git ls-files '*.json')
          exit "$fail"

      - name: Validate YAML manifests parse
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys, pathlib, yaml
          fail = 0
          for p in sorted(pathlib.Path(".").rglob("*.yaml")) + sorted(pathlib.Path(".").rglob("*.yml")):
              if ".git/" in str(p):
                  continue
              try:
                  yaml.safe_load(p.read_text(encoding="utf-8"))
                  print(f"ok    {p}")
              except Exception as e:
                  print(f"FAIL  {p}: {e}")
                  fail = 1
          sys.exit(fail)
          PY

      - name: Required harness manifests present
        run: |
          set -euo pipefail
          required="
          .claude-plugin/marketplace.json
          .claude-plugin/plugin.json
          .codex-plugin/plugin.json
          .kimi-plugin/plugin.json
          .hermes-plugin/plugin.yaml
          .hermes-plugin/__init__.py
          .opencode/plugins/${PLUGIN_NAME}.js
          .opencode/INSTALL.md
          .agents/plugins/marketplace.json
          gemini-extension.json
          GEMINI.md
          package.json
          CLAUDE.md
          AGENTS.md
          README.md
          LICENSE
          "
          fail=0
          for f in $required; do
            if [ -e "$f" ]; then
              echo "ok    $f"
            else
              echo "FAIL  $f missing"
              fail=1
            fi
          done
          exit "$fail"

      - name: AGENTS.md is a symlink to CLAUDE.md
        run: |
          set -euo pipefail
          target=$(readlink AGENTS.md || true)
          if [ "$target" != "CLAUDE.md" ]; then
            echo "FAIL  AGENTS.md must be a symlink to CLAUDE.md (got: '${target:-not a symlink}')"
            exit 1
          fi
          echo "ok    AGENTS.md -> CLAUDE.md"

      - name: Skills are flat under skills/ and never nested under plugins/
        run: |
          set -euo pipefail
          if [ -d plugins ]; then
            echo "FAIL  plugins/ exists — this repo uses the root layout, not the nested mono layout"
            exit 1
          fi
          if [ ! -d skills ]; then
            echo "FAIL  skills/ missing"
            exit 1
          fi
          echo "ok    flat skills/ layout"

      - name: Skill frontmatter name matches its directory
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys, pathlib, re
          fail = 0
          skills = sorted(p for p in pathlib.Path("skills").iterdir() if p.is_dir())
          if not skills:
              print("FAIL  no skills found")
              sys.exit(1)
          for d in skills:
              md = d / "SKILL.md"
              if not md.is_file():
                  print(f"FAIL  {d}: SKILL.md missing")
                  fail = 1
                  continue
              text = md.read_text(encoding="utf-8")
              m = re.match(r"^---\n(.*?)\n---\n", text, re.S)
              if not m:
                  print(f"FAIL  {md}: no YAML frontmatter")
                  fail = 1
                  continue
              fm = m.group(1)
              nm = re.search(r"^name:\s*(.+?)\s*$", fm, re.M)
              if not nm:
                  print(f"FAIL  {md}: frontmatter has no name:")
                  fail = 1
                  continue
              name = nm.group(1).strip().strip("\"'")
              if ":" in name:
                  print(f"FAIL  {md}: name must be bare, not namespaced (got {name!r})")
                  fail = 1
              elif name != d.name:
                  print(f"FAIL  {md}: name {name!r} != directory {d.name!r}")
                  fail = 1
              else:
                  print(f"ok    {md}")
              if not re.search(r"^description:", fm, re.M):
                  print(f"FAIL  {md}: frontmatter has no description:")
                  fail = 1
          sys.exit(fail)
          PY

      - name: SKILL.md respects progressive disclosure
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, sys, pathlib
          limit = int(float(os.environ["MAX_SKILL_LINES"]))
          fail = 0
          for md in sorted(pathlib.Path("skills").glob("*/SKILL.md")):
              n = len(md.read_text(encoding="utf-8").splitlines())
              if n > limit:
                  print(f"FAIL  {md}: {n} lines > {limit} — extract detail into references/")
                  fail = 1
              else:
                  print(f"ok    {md} ({n} lines)")
          sys.exit(fail)
          PY

      - name: Skill descriptions fit the Codex context budget
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, sys, re, pathlib
          budget = int(float(os.environ["DESCRIPTION_BUDGET"]))
          total = 0
          fail = 0
          for md in sorted(pathlib.Path("skills").glob("*/SKILL.md")):
              text = md.read_text(encoding="utf-8")
              fm = re.match(r"^---\n(.*?)\n---\n", text, re.S).group(1)
              m = re.search(r"^description:(.*?)(?=^\S|\Z)", fm, re.M | re.S)
              desc = " ".join(m.group(1).split()) if m else ""
              if not desc:
                  print(f"FAIL  {md}: empty description")
                  fail = 1
              if len(desc) > 1024:
                  print(f"FAIL  {md}: description {len(desc)} chars > 1024 (harness limit)")
                  fail = 1
              total += len(desc)
              print(f"{len(desc):>5}  {md}")
          pct = total / budget * 100
          print(f"TOTAL {total} / {budget} = {pct:.1f}%")
          if total > budget:
              print(f"FAIL  description total {total} exceeds the Codex budget {budget}")
              fail = 1
          sys.exit(fail)
          PY

      - name: Version agrees across all manifests
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys, json, re, pathlib
          versions = {}
          for f in [
              ".claude-plugin/plugin.json",
              ".codex-plugin/plugin.json",
              ".kimi-plugin/plugin.json",
              "gemini-extension.json",
              "package.json",
          ]:
              versions[f] = json.loads(pathlib.Path(f).read_text(encoding="utf-8"))["version"]
          mp = json.loads(pathlib.Path(".claude-plugin/marketplace.json").read_text(encoding="utf-8"))
          versions[".claude-plugin/marketplace.json"] = mp["plugins"][0]["version"]
          y = pathlib.Path(".hermes-plugin/plugin.yaml").read_text(encoding="utf-8")
          versions[".hermes-plugin/plugin.yaml"] = re.search(r"^version:\s*(\S+)", y, re.M).group(1)

          for f, v in versions.items():
              print(f"{v}\t{f}")
          distinct = set(versions.values())
          if len(distinct) != 1:
              print(f"FAIL  manifests disagree on version: {sorted(distinct)}")
              sys.exit(1)
          print("ok    all manifests agree")
          PY

      - name: Declared cross-file facts agree
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, sys, pathlib, yaml
          # The step above gates one hardcoded equality (version) over one
          # hardcoded file list. This one gates any equality a caller declares,
          # because the fact that drifts is repo-specific: `license` is stated
          # six times in all sixteen repos, while claudecode-skills pins a
          # bundled-asset SHA in six places of its own.
          #
          # A value is a regex capture group, never a YAML/JSON key path. The
          # SHA case is a bare string in prose, so key-only extraction would
          # cover `license` and miss the case that motivated the gate; one
          # mechanism that covers both beats two that each cover half.
          raw = os.environ.get("CONSISTENCY_CHECKS", "").strip()
          if not raw:
              print("ok    no consistency sets declared")
              sys.exit(0)
          try:
              sets = yaml.safe_load(raw)
          except yaml.YAMLError as e:
              sys.exit(f"FAIL  consistency-checks is not valid YAML: {e}")
          if not isinstance(sets, dict) or not sets:
              sys.exit("FAIL  consistency-checks must be a mapping of "
                       "<set name> -> {<path glob>: <regex>}")
          fail = 0
          for name, sites in sets.items():
              if not isinstance(sites, dict) or not sites:
                  print(f"FAIL  {name}: needs a mapping of <path glob> -> <regex>")
                  fail = 1
                  continue
              seen = {}
              for glob, pattern in sites.items():
                  try:
                      rx = re.compile(str(pattern), re.M)
                  except re.error as e:
                      print(f"FAIL  {name}: bad regex {pattern!r}: {e}")
                      fail = 1
                      continue
                  paths = sorted(p for p in pathlib.Path(".").glob(str(glob)) if p.is_file())
                  if not paths:
                      # Loud, for the same reason the shellcheck step refuses a
                      # failed discovery: a set that quietly checks nothing is
                      # indistinguishable from a set that passed.
                      print(f"FAIL  {name}: glob {glob!r} matched no file")
                      fail = 1
                      continue
                  for p in paths:
                      try:
                          text = p.read_text(encoding="utf-8")
                      except (UnicodeDecodeError, OSError) as e:
                          print(f"FAIL  {name}: {p} is unreadable as text: {e}")
                          fail = 1
                          continue
                      m = rx.search(text)
                      if not m or not m.groups():
                          print(f"FAIL  {name}: {p} has no capture-group match for {pattern!r}")
                          fail = 1
                          continue
                      seen[str(p)] = m.group(1)
              # Every file and its value, always -- "these files disagree" is
              # only actionable next to the values it is talking about.
              for f, v in sorted(seen.items()):
                  print(f"{v}\t{f}")
              distinct = sorted(set(seen.values()))
              if len(distinct) > 1:
                  print(f"FAIL  {name}: sites disagree: {distinct}")
                  fail = 1
              elif distinct:
                  print(f"ok    {name} = {distinct[0]} across {len(seen)} file(s)")
          sys.exit(fail)
          PY

      - name: Plugin name is consistent everywhere
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, sys, json, re, pathlib
          want = os.environ["PLUGIN_NAME"]
          fail = 0
          def check(label, got):
              global fail
              if got != want:
                  print(f"FAIL  {label}: expected {want!r}, got {got!r}")
                  fail = 1
              else:
                  print(f"ok    {label}")

          for f in [".claude-plugin/plugin.json", ".codex-plugin/plugin.json",
                    ".kimi-plugin/plugin.json", "gemini-extension.json"]:
              check(f, json.loads(pathlib.Path(f).read_text(encoding="utf-8"))["name"])

          mp = json.loads(pathlib.Path(".claude-plugin/marketplace.json").read_text(encoding="utf-8"))
          check(".claude-plugin/marketplace.json plugins[0]", mp["plugins"][0]["name"])
          ag = json.loads(pathlib.Path(".agents/plugins/marketplace.json").read_text(encoding="utf-8"))
          check(".agents/plugins/marketplace.json plugins[0]", ag["plugins"][0]["name"])
          y = pathlib.Path(".hermes-plugin/plugin.yaml").read_text(encoding="utf-8")
          check(".hermes-plugin/plugin.yaml", re.search(r"^name:\s*(\S+)", y, re.M).group(1))
          sys.exit(fail)
          PY

      - name: Shell scripts pass shellcheck (sh:check)
        run: |
          set -euo pipefail
          # Vendored trees are skipped: the repo is forbidden to edit them, so a
          # finding there has no remedy it can apply — fix it at the SSOT instead.
          #
          # Neither half of discovery runs through `mapfile -t x < <(...)`: a
          # process substitution's exit status is invisible to `set -e`, so a
          # failed `git ls-files` — a malformed pathspec being the realistic
          # trigger — left an empty array, printed "no shell scripts to check"
          # and exited 0 with the gate off. Both now go through a file, so
          # git's and sed's exit statuses are the step's. Same shape, and the
          # same reason, as the self-checks step below.
          listing=$(mktemp)
          trap 'rm -f "$listing"' EXIT
          printf '%s\n' "$SHELLCHECK_EXCLUDE_PATHS" | tr ',' '\n' \
            | sed 's/^[[:space:]]*//; s/[[:space:]]*$//; /^$/d' > "$listing"
          skip=()
          while IFS= read -r p; do
            # Trailing slashes are stripped so `lib/vendor/` and `lib/vendor`
            # select the same tree. An entry made only of slashes would strip
            # to `:(exclude)` over the repo root and silently disable the gate,
            # so reject it loudly rather than rely on a sanitiser to make a
            # caller's degenerate input disappear.
            p=${p%"${p##*[!/]}"}
            if [ -z "$p" ]; then
              echo "FAIL  shellcheck-exclude-paths: an entry of '/' would exclude the whole repo"
              exit 1
            fi
            skip+=(":(exclude)$p")
          done < "$listing"
          [ "${#skip[@]}" -eq 0 ] || echo "note  shellcheck skips: ${skip[*]}"
          git ls-files -z -- '*.sh' "${skip[@]}" > "$listing"
          mapfile -t -d '' scripts < "$listing"
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "ok    no shell scripts to check"
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning "${scripts[@]}"
          echo "ok    ${#scripts[@]} shell script(s) clean"

      - name: Workflow scripts parse and declare a bare meta.name
        run: |
          set -euo pipefail
          node <<'JS'
          const fs = require("fs");
          const path = require("path");
          const { execFileSync } = require("child_process");

          const files = execFileSync("git", ["ls-files", "workflows/*.js"], { encoding: "utf8" })
            .split("\n").filter(Boolean);
          if (files.length === 0) {
            console.log("ok    no workflow scripts tracked - nothing to check");
            process.exit(0);
          }
          // The Workflow host evaluates a script as an async function body, so
          // top-level `await` and `return` are legal there but not in a plain ES
          // module - a bare `node --check` fails on a correct script. Mirror the
          // host instead: lift `export const meta` to a plain declaration, then
          // parse (never run) the rest as one async function body.
          const AsyncFunction = Object.getPrototypeOf(async function () {}).constructor;
          let fail = 0;
          for (const f of files) {
            const src = fs.readFileSync(f, "utf8")
              .replace(/^export\s+const\s+meta\b/m, "const meta");
            try {
              new AsyncFunction(src);
            } catch (e) {
              console.log(`FAIL  ${f}: ${e.name}: ${e.message}`);
              fail = 1;
              continue;
            }
            const m = /const\s+meta\b[\s\S]{0,400}?\bname:\s*['"]([^'"]+)['"]/.exec(src);
            const want = path.basename(f, ".js");
            if (!m) {
              console.log(`FAIL  ${f}: meta has no name:`);
              fail = 1;
            } else if (m[1].includes(":")) {
              console.log(`FAIL  ${f}: meta.name must be bare, not namespaced (got '${m[1]}') - callers add the <plugin>: prefix`);
              fail = 1;
            } else if (m[1] !== want) {
              console.log(`FAIL  ${f}: meta.name '${m[1]}' != filename '${want}'`);
              fail = 1;
            } else {
              console.log(`ok    ${f} (meta.name ${m[1]})`);
            }
          }
          process.exit(fail);
          JS

      - name: No emojis in tracked text
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, sys, subprocess, pathlib
          # Pictographic planes only. Typographic marks the skills legitimately
          # use (arrows, check marks, box drawing) are not emoji and must not
          # trip this check.
          def is_emoji(ch):
              cp = ord(ch)
              return cp >= 0x1F000 or cp == 0xFE0F
          # Path prefixes a caller declared exempt, for a skill whose subject
          # matter IS emoji (e.g. one that teaches emoji-styled blog headings).
          # Empty by default, so every existing caller keeps the repo-wide ban.
          raw = re.split(r"[,\n]", os.environ.get("ALLOW_EMOJI_PATHS", ""))
          allowed = tuple(s.strip() for s in raw if s.strip())
          if allowed:
              print(f"note  emoji allowed under: {', '.join(allowed)}")
          # Vendored trees are not scanned at all, for the same reason the
          # shellcheck step skips them: the repo may not edit them, so a finding
          # there has no remedy it can apply -- fix it at the SSOT instead. Same
          # input, and git's own :(exclude) carries the directory boundary, so
          # `lib/vendor` never swallows a sibling `lib/vendor-tools/`.
          raw = re.split(r"[,\n]", os.environ.get("SHELLCHECK_EXCLUDE_PATHS", ""))
          skip = [f":(exclude){s}" for s in (x.strip().rstrip("/") for x in raw) if s]
          if skip:
              print(f"note  emoji scan skips: {' '.join(skip)}")
          files = subprocess.run(["git", "ls-files", "--", *skip], capture_output=True,
                                 text=True, check=True).stdout.split()
          bad = []
          for f in files:
              p = pathlib.Path(f)
              if p.is_symlink() or not p.is_file():
                  continue
              if allowed and f.startswith(allowed):
                  continue
              try:
                  text = p.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              for i, line in enumerate(text.splitlines(), 1):
                  for ch in line:
                      if is_emoji(ch):
                          bad.append(f"{f}:{i}: {ch!r}")
                          break
          if bad:
              print("FAIL  emoji found:")
              print("\n".join(bad))
              sys.exit(1)
          print("ok    no emojis")
          PY

      - name: Repo self-checks pass (tests/)
        run: |
          set -euo pipefail
          # Convention, and the rules a check must follow: see README "CI".
          # Another shape (a `--self-test` flag, a `lib/*.selfcheck.sh`) is
          # wired up by a one-line `tests/` script, never by a third branch here.
          #
          # `:(glob)` stops `*` from crossing `/`, so only direct children of
          # the repo-root `tests/` match. A vendored tree can never be one, so
          # this step needs no `shellcheck-exclude-paths` plumbing.
          #
          # git writes the listing to a file rather than into `mapfile -t x <
          # <(git ls-files)`: the process substitution hides git's exit status
          # from `set -e`, so a git failure would print "no tests tracked",
          # exit 0, and silently disable this gate. `-z` with `-d ''` keeps a
          # tracked path containing a newline one path, and discovery is over
          # tracked files only, so an untracked `tests/run.sh` left in the
          # working tree cannot hijack it.
          listing=$(mktemp)
          git ls-files -z -- ':(glob)tests/*.sh' > "$listing"
          mapfile -t -d '' checks < "$listing"
          rm -f "$listing"
          if [ "${#checks[@]}" -eq 0 ]; then
            echo "ok    no tests tracked"
            exit 0
          fi
          for c in "${checks[@]}"; do
            if [ "$c" = tests/run.sh ]; then
              checks=(tests/run.sh)
              break
            fi
          done
          for c in "${checks[@]}"; do
            echo "note  running $c"
            bash "$c"
          done
          echo "ok    ${#checks[@]} check(s) passed"
